name: OfflineSkin
version: 1.0.0
main: com.offlineskin.OfflineSkinPlugin
api-version: "26.2"
description: Matches offline-mode players to premium accounts with the same name and applies their skin.
authors: [DSH]

commands:
  skin:
    description: Apply a premium player's skin to yourself by name, or reset your skin.
    usage: /skin <name|clear>
    aliases: [offlineskin, oskin]

permissions:
  offlineskin.apply:
    description: Allows applying premium skins by name.
    default: true
  offlineskin.clear:
    description: Allows resetting your skin.
    default: true
